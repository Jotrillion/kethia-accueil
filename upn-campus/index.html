  <style>

    main{min-width:0;padding:0 38px 40px}.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);color:#66736b;font-size:10px}.topbar-right{display:flex;align-items:center;gap:10px}.privacy{display:flex;align-items:center;gap:6px;color:#69776f}.privacy svg{width:14px;height:14px;color:var(--green)}.language{border:1px solid var(--line);border-radius:6px;padding:7px 9px;background:white;color:#526057;font-size:10px}.page{max-width:1240px;margin:0 auto}.heading{padding:29px 0 20px;display:flex;align-items:flex-end;justify-content:space-between;gap:18px}.eyebrow{font-size:9px;text-transform:uppercase;letter-spacing:.13em;color:var(--green);font-weight:700;margin-bottom:7px}h1{font:400 31px/1.1 "DM Serif Display",Georgia,serif;letter-spacing:0;margin:0}.heading p{font-size:11px;color:var(--muted);margin:7px 0 0}.actions{display:flex;gap:8px}.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:36px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:white;color:#46534b;font-size:10px;font-weight:600;white-space:nowrap}.btn:hover{background:#f7f9f6}.btn svg{width:14px;height:14px}.btn-primary{background:var(--green);border-color:var(--green);color:white}.btn-primary:hover{background:#12563f}.btn-dark{background:var(--dark);color:white;border-color:var(--dark)}

    .dashboard-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(250px,.8fr);gap:13px;margin-top:14px;align-items:start}.panel{background:white;border:1px solid var(--line);border-radius:8px;min-width:0}.panel-head{min-height:54px;border-bottom:1px solid var(--line);padding:0 15px;display:flex;align-items:center;justify-content:space-between;gap:10px}.panel-title{font-size:11px;font-weight:700}.panel-subtitle{font-size:9px;color:#849088;margin-top:3px}.quiet-link{border:0;background:none;color:var(--green);font-size:10px;font-weight:600;padding:5px}.journey{padding:13px 15px 15px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}.step{padding:11px 9px 9px;border:1px solid #edf0ec;border-radius:6px;min-height:83px}.step-num{font-size:9px;color:var(--green);font-weight:700;letter-spacing:.08em}.step strong{display:block;margin-top:8px;font-size:10px}.step span{display:block;margin-top:4px;font-size:9px;line-height:1.4;color:#7c8980}.scenario-list{padding:4px 14px 10px}.scenario-link{width:100%;display:grid;grid-template-columns:29px 1fr 14px;align-items:center;gap:9px;text-align:left;padding:10px 0;border:0;border-bottom:1px solid #eef1ed;background:white}.scenario-link:last-child{border:0}.scenario-icon{width:28px;height:28px;border-radius:8px;background:var(--pale);display:grid;place-items:center;color:var(--green);font-size:13px}.scenario-link strong{display:block;font-size:10px;color:#344239}.scenario-link small{display:block;margin-top:3px;font-size:9px;color:#89938d}.scenario-link .arrow{color:#829087;font-size:14px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{height:32px;padding:0 10px;background:#fafbfa;color:#89948c;font-size:8px;font-weight:500}td{height:48px;border-top:1px solid #eef1ed;padding:0 10px;color:#59655d;font-size:9px}th:first-child,td:first-child{padding-left:15px}.visitor-name{font-weight:600;color:#29362f}.visitor-sub{color:#8a958e;font-size:8px;margin-top:3px}.status{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:20px;background:#eaf3ed;color:#26724d;font-size:8px;font-weight:600}.status:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.status-expected{background:#fff3dd;color:#996712}.status-left{background:#f0f2ef;color:#747e77}.row-action{border:0;background:none;color:var(--green);font-size:9px;font-weight:700;padding:5px 0}.empty{padding:25px;text-align:center;font-size:10px;color:#87928b}
    .practice-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:13px;align-items:start}.scenario-menu{padding:5px 13px}.scenario-choice{width:100%;text-align:left;background:white;border:0;border-bottom:1px solid #eef1ed;padding:12px 4px}.scenario-choice:last-child{border:0}.scenario-choice strong{display:block;font-size:10px;color:#3d4a42}.scenario-choice span{display:block;font-size:9px;color:#89938d;margin-top:4px}.scenario-choice.active strong{color:var(--green)}.scenario-choice.active{box-shadow:inset 2px 0 var(--green);padding-left:10px}.exercise{padding:19px}.exercise-top{display:flex;justify-content:space-between;gap:10px;align-items:center}.tag{font-size:9px;color:var(--green);font-weight:700;background:var(--pale);border-radius:20px;padding:5px 8px}.score{font-size:9px;color:#748078}.scenario-title{font:400 23px/1.15 "DM Serif Display",Georgia,serif;margin:18px 0 7px}.scenario-context{font-size:10px;line-height:1.55;color:#738078}.dialogue{margin:16px 0;padding:13px 14px;background:#f5f7f4;border-left:3px solid #c5df82;color:#35433a;font:14px/1.5 "DM Serif Display",Georgia,serif}.answer-list{display:grid;gap:7px}.answer{display:flex;align-items:flex-start;gap:9px;width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:6px;background:white;color:#4c5951;text-align:left;font-size:10px;line-height:1.45}.answer:hover:not(:disabled){border-color:#9ebda8;background:#fbfdfb}.answer:disabled{cursor:default}.answer-mark{flex:none;width:17px;height:17px;display:grid;place-items:center;border:1px solid #dce3dc;border-radius:50%;font-size:9px;color:#627067}.answer.correct{border-color:#9fc8a9;background:#edf7ef}.answer.correct .answer-mark{background:#388456;color:white;border:0}.answer.incorrect{border-color:#e8b3a5;background:#fff4f1}.answer.incorrect .answer-mark{background:#d76d56;color:white;border:0}.feedback{display:none;padding:11px 12px;margin-top:11px;border-radius:6px;background:#edf6ee;color:#386046;font-size:10px;line-height:1.5}.feedback.show{display:block}.feedback.miss{background:#fff4ec;color:#815a32}.exercise-footer{display:flex;justify-content:space-between;align-items:center;margin-top:12px;color:#8a948d;font-size:9px}
    .guide-tools{padding:12px;display:flex;gap:8px}.guide-search{flex:1;min-width:100px;border:1px solid var(--line);border-radius:6px;padding:0 10px;height:35px;font-size:10px}.guide-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.guide-item{padding:14px;border:1px solid var(--line);border-radius:7px;background:white}.guide-top{display:flex;justify-content:space-between;align-items:start;gap:8px}.guide-top strong{font-size:11px}.guide-category{font-size:8px;color:var(--green);background:var(--pale);border-radius:15px;padding:4px 7px;white-space:nowrap}.guide-item p{font-size:9px;line-height:1.55;color:#78847c;margin:9px 0 0}.guide-item .direction{padding-top:8px;border-top:1px solid #eef1ed;color:#49574e}.guide-disclaimer{font-size:9px;color:#8a6b39;background:#fff7e9;border:1px solid #f1e5c9;border-radius:6px;padding:10px 12px;margin-bottom:12px;line-height:1.5}
    .modal-backdrop{display:none;position:fixed;inset:0;z-index:20;background:#12291f80;align-items:center;justify-content:center;padding:16px}.modal-backdrop.open{display:flex}.modal{width:min(460px,100%);background:white;border-radius:9px;box-shadow:var(--shadow)}.modal-head{padding:17px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:start}.modal-head h2{font:400 23px/1.1 "DM Serif Display",Georgia,serif;margin:0}.modal-head p{font-size:9px;color:var(--muted);margin:5px 0 0}.close{border:0;background:none;color:#68756d;font-size:19px}.form{padding:16px 19px 19px;display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{display:grid;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:9px;color:#637068;font-weight:600}.field input,.field select{height:35px;min-width:0;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:white;font-size:10px}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:7px;margin-top:4px}.toast{position:fixed;z-index:30;right:20px;bottom:20px;padding:12px 15px;border-radius:7px;background:var(--dark);color:white;font-size:10px;box-shadow:var(--shadow);opacity:0;transform:translateY(8px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:1000px){.app{grid-template-columns:68px minmax(0,1fr)}.sidebar{align-items:center;padding:20px 8px 14px}.brand{padding:0 0 28px}.brand b,.brand small,.nav-label,.nav button span,.sidebar-note{display:none}.nav{width:100%}.nav button{justify-content:center;padding:0}.nav button.active{box-shadow:inset 0 2px var(--lime)}main{padding-left:24px;padding-right:24px}.dashboard-grid{grid-template-columns:1fr}.dashboard-grid .side-column{display:grid;grid-template-columns:1fr 1fr;gap:12px}}
    @media(max-width:620px){.app{display:block;padding-bottom:62px}.sidebar{position:sticky;top:0;z-index:10;min-height:0;height:56px;flex-direction:row;justify-content:flex-start;padding:0 14px}.brand{padding:0}.brand b{display:block;font-size:14px}.brand small{display:block;font-size:8px}.brand-mark{width:31px;height:31px}.sidebar .nav-label{display:none}.sidebar .nav{display:flex;position:fixed;inset:auto 0 0;z-index:15;height:62px;justify-content:space-around;align-items:center;gap:0;padding:4px 3px env(safe-area-inset-bottom);background:var(--dark);border-top:1px solid #ffffff20}.sidebar .nav button{display:flex;flex:1;flex-direction:column;justify-content:center;gap:3px;min-height:49px;padding:3px 1px;font-size:8px}.sidebar .nav button span{display:block;font-size:8px;white-space:nowrap}.sidebar .nav button.active{box-shadow:inset 0 2px var(--lime)}.sidebar .nav svg{width:16px;height:16px}main{padding:0 14px 23px}.topbar{height:48px;border:0}.heading{padding:12px 0 16px;align-items:flex-start;flex-direction:column;gap:13px}h1{font-size:28px}.heading p{line-height:1.45}.actions{width:100%}.actions .btn{flex:1}.stats{gap:7px}.stat{min-height:78px;padding:11px}.stat-label{font-size:9px}.stat-value{font-size:24px}.dashboard-grid{gap:10px;margin-top:10px}.dashboard-grid .side-column{grid-template-columns:1fr}.journey{grid-template-columns:repeat(2,minmax(0,1fr))}.practice-layout{grid-template-columns:1fr}.scenario-menu{display:flex;gap:4px;overflow:auto;padding:6px}.scenario-choice{flex:0 0 142px;border:1px solid var(--line);border-radius:6px;padding:9px}.scenario-choice.active{box-shadow:inset 0 2px var(--green);padding:9px}.guide-list{grid-template-columns:1fr}.guide-tools{padding:10px}.form{padding:14px}.modal-head{padding:15px}.table-wrap{margin:0 -1px}.exercise{padding:14px}.exercise-top{align-items:flex-start}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}

<body>
  <div class="app">
    <aside class="sidebar" aria-label="Navigation principale">
      <div class="brand"><div class="brand-mark" aria-hidden="true">H</div><div><b>HORA</b><small>CAMPUS · FORMATION</small></div></div>
      <div class="nav-label">Espace étudiant</div>
      <nav class="nav" aria-label="Pages">
        <button class="active" data-page="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="11" width="7" height="10" rx="1.5"/><rect x="3" y="14" width="8" height="7" rx="1.5"/></svg><span>Accueil</span></button>
        <button data-page="practice"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21V5.5Z"/><path d="M4 6h13m-9 4h8m-8 4h6"/></svg><span>Entraînement</span></button>
        <button data-page="guide"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Z"/><path d="M9 3v15m6-12v15"/></svg><span>Repères campus</span></button>
        <button data-page="visitors"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="9" cy="8" r="3.3"/><path d="M2.5 20c.5-3.5 2.7-5.5 6.5-5.5s6 2 6.5 5.5M17 6a3 3 0 0 1 0 5.5M17 15c2.5.3 4 2 4.5 4.5"/></svg><span>Visiteurs</span></button>
      </nav>
      <div class="sidebar-note"><strong>MODE SIMULATION</strong><span>Les visiteurs et repères affichés sont des exemples. N’utilisez pas de données personnelles réelles.</span></div>
    </aside>
    <main>
      <header class="topbar"><span id="todayLabel"></span><div class="topbar-right"><span class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 1 1 8 0v3m-4 5v2"/></svg>Données de démonstration</span><select class="language" aria-label="Langue de pratique"><option>FR · Français</option><option>LN · Lingala</option><option>EN · English</option><option>SW · Kiswahili</option></select></div></header>
      <div class="page" id="page"></div>
    </main>
  </div>
  <div class="modal-backdrop" id="backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><section class="modal"><div class="modal-head"><div><h2 id="modalTitle">Simuler une arrivée</h2><p>Utilisez uniquement des données fictives pour l’exercice.</p></div><button class="close" id="closeModal" aria-label="Fermer">×</button></div><form class="form" id="visitorForm"><div class="field"><label for="personName">Nom fictif *</label><input id="personName" name="name" required maxlength="60" placeholder="Ex. Amina L. (démo)"></div><div class="field"><label for="personLanguage">Langue souhaitée</label><select id="personLanguage" name="language"><option>Français</option><option>Lingala</option><option>English</option><option>Kiswahili</option></select></div><div class="field full"><label for="personDestination">Service demandé *</label><select id="personDestination" name="destination" required><option value="">Choisir un repère de démonstration</option><option>Service des inscriptions (démo)</option><option>Administration académique (démo)</option><option>Bibliothèque (démo)</option><option>Faculté / département (à préciser)</option></select></div><div class="field full"><label for="personPurpose">Motif général (sans information sensible)</label><input id="personPurpose" name="purpose" maxlength="80" placeholder="Ex. Demande d’orientation"></div><div class="form-actions"><button class="btn" type="button" id="cancelModal">Annuler</button><button class="btn btn-primary" type="submit">Ajouter à la simulation</button></div></form></section></div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script>
    const dateLabel = new Intl.DateTimeFormat('fr-FR', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(new Date());
    document.getElementById('todayLabel').textContent = dateLabel.charAt(0).toUpperCase() + dateLabel.slice(1);
    const seedVisitors = [
      { id: 1, name: 'Amina L. (démo)', language: 'Français', destination: 'Service des inscriptions (démo)', purpose: 'Demande d’orientation', time: '09:15', status: 'arrived' },
      { id: 2, name: 'Patrick I. (démo)', language: 'Lingala', destination: 'Bibliothèque (démo)', purpose: 'Repères campus', time: '09:40', status: 'expected' },
      { id: 3, name: 'Nadia M. (démo)', language: 'Français', destination: 'Administration académique (démo)', purpose: 'Demande d’information', time: '10:10', status: 'expected' }
    ];
    let visitors;
    try { visitors = JSON.parse(localStorage.getItem('hora-upn-visitors')) || seedVisitors; } catch { visitors = seedVisitors; }
    const scenarios = [
      { title: 'Une nouvelle étudiante cherche la scolarité', skill: 'Écoute et clarification', quote: '« Bonjour, je viens pour mon inscription, mais je ne sais pas à quel service m’adresser. »', answers: [
        { text: 'Lui demander ce qu’elle a déjà comme information, puis vérifier le service et le repère officiel avant de l’orienter.', good: true, feedback: 'Bonne démarche : écoute active, clarification du besoin, puis orientation basée sur un repère à jour.' },
        { text: 'Lui indiquer immédiatement un bâtiment au hasard pour écourter l’attente.', good: false, feedback: 'Évitez de deviner un lieu. Vérifiez d’abord le service compétent et l’information officielle.' },
        { text: 'Lui demander son dossier complet et conserver ses pièces à l’accueil.', good: false, feedback: 'Ne collectez pas de documents ou de données qui ne sont pas nécessaires à votre rôle.' }
      ]},
      { title: 'Un visiteur sans rendez-vous', skill: 'Calme et confidentialité', quote: '« Je dois voir un membre du personnel, mais je n’ai pas de rendez-vous. »', answers: [
        { text: 'Demander la personne ou le service recherché, vérifier la procédure de contact et expliquer les options d’attente avec courtoisie.', good: true, feedback: 'Exact : identifiez la demande, vérifiez le protocole et donnez une information claire sans promettre une disponibilité.' },
        { text: 'Annoncer que cette personne est disponible sans vérifier.', good: false, feedback: 'Ne confirmez jamais une disponibilité avant de l’avoir vérifiée.' },
        { text: 'Demander au visiteur de raconter son problème devant la file.', good: false, feedback: 'Préservez la confidentialité : demandez seulement le niveau de détail nécessaire, à voix discrète.' }
      ]},
      { title: 'Une personne préfère échanger autrement', skill: 'Accessibilité et respect', quote: '« Je comprends mieux si vous écrivez les indications, s’il vous plaît. »', answers: [
        { text: 'Confirmer sa préférence, écrire des étapes courtes et demander si les indications sont suffisamment claires.', good: true, feedback: 'Bonne réponse : demandez la préférence, adaptez l’échange et vérifiez que l’orientation est comprise.' },
        { text: 'Répéter la même explication plus fort sans demander.', good: false, feedback: 'Évitez les suppositions. Demandez quelle forme de communication convient à la personne.' },
        { text: 'Refuser et demander à la personne de revenir accompagnée.', good: false, feedback: 'Proposez un aménagement simple au lieu de transférer la charge à la personne.' }
      ]}
    ];
    const places = [
      { name: 'Point d’accueil', category: 'Premier contact', detail: 'Écoute de la demande, information générale et orientation vers le service compétent.', route: 'Repère de départ de la simulation. Vérifiez toujours le plan et les horaires officiels du campus.' },
      { name: 'Service des inscriptions', category: 'Scolarité · démo', detail: 'Exemple de destination pour une demande liée aux inscriptions.', route: 'Parcours pédagogique uniquement : confirmer l’emplacement réel auprès de l’administration.' },
      { name: 'Administration académique', category: 'Administration · démo', detail: 'Exemple de destination pour une demande administrative générale.', route: 'Parcours pédagogique uniquement : consulter la signalétique ou le répertoire officiel.' },
      { name: 'Bibliothèque', category: 'Documentation · démo', detail: 'Exemple de destination pour une demande d’accès à la documentation.', route: 'Parcours pédagogique uniquement : valider l’accès et les horaires avec le service.' },
      { name: 'Faculté / département', category: 'Orientation · à préciser', detail: 'Repère générique à préciser selon la faculté ou le département recherché.', route: 'Demander le nom du service et vérifier l’annuaire officiel avant d’orienter.' }
    ];
    let activePage = 'home';
    let activeScenario = 0;
    let chosenAnswer = null;
    let attempts = 0;
    let correct = 0;
    let guideQuery = '';
    let toastTimer;
    const page = document.getElementById('page');
    const toast = document.getElementById('toast');
    const icon = { plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 5v14M5 12h14"/></svg>', arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>' };
    const statusName = state => ({ expected: 'À accueillir', arrived: 'Arrivé·e', left: 'Visite terminée' })[state];
    function save() { localStorage.setItem('hora-upn-visitors', JSON.stringify(visitors)); }
    function notify(message) { toast.textContent = message; toast.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.classList.remove('show'), 2800); }
    function status(state) { return `<span class="status ${state === 'expected' ? 'status-expected' : state === 'left' ? 'status-left' : ''}">${statusName(state)}</span>`; }
    function table(list, heading = 'File d’accueil simulée') {
      return `<section class="panel"><div class="panel-head"><div><div class="panel-title">${heading}</div><div class="panel-subtitle">Données fictives · aucune notification externe</div></div><button class="quiet-link" data-new-visitor>+ Simuler une arrivée</button></div><div class="table-wrap"><table><thead><tr><th>VISITEUR (DÉMO)</th><th>LANGUE</th><th>DEMANDE</th><th>STATUT</th><th></th></tr></thead><tbody>${list.length ? list.map(person => `<tr><td><span class="visitor-name">${person.name}</span><span class="visitor-sub">${person.time}</span></td><td>${person.language}</td><td>${person.destination}</td><td>${status(person.status)}</td><td>${person.status === 'expected' ? `<button class="row-action" data-action="arrive" data-id="${person.id}">Accueillir</button>` : person.status === 'arrived' ? `<button class="row-action" data-action="leave" data-id="${person.id}">Clôturer</button>` : '<span class="visitor-sub">Terminé</span>'}</td></tr>`).join('') : '<tr><td colspan="5"><div class="empty">Aucune visite dans cette simulation.</div></td></tr>'}</tbody></table></div></section>`;
    }
    function homeView() {
      const arrived = visitors.filter(person => person.status === 'arrived').length;
      const awaiting = visitors.filter(person => person.status === 'expected').length;
      const recent = visitors.filter(person => person.status !== 'left').slice(0, 4);
      return `<div class="heading"><div><div class="eyebrow">UPN · Profil pédagogique</div><h1>Pratiquer l’accueil, pas à pas.</h1><p>Un espace de mise en situation pour écouter, informer et orienter avec justesse.</p></div><div class="actions"><button class="btn btn-primary" data-go="practice">Commencer un exercice ${icon.arrow}</button></div></div>
        <div class="notice-band"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg><span><strong>Environnement de formation.</strong> Les visiteurs, services et parcours sont fictifs. Vérifiez les informations du campus auprès de l’UPN et ne saisissez aucune donnée personnelle réelle.</span></div>
        <section class="stats"><article class="stat"><div class="stat-label">Exercices réussis</div><div class="stat-value">${correct}<small>sur ${attempts} tentatives</small></div></article><article class="stat"><div class="stat-label">Personnes dans la simulation</div><div class="stat-value">${visitors.length}<small>visiteurs fictifs</small></div></article><article class="stat"><div class="stat-label">À accueillir</div><div class="stat-value">${awaiting}<small>arrivée${awaiting > 1 ? 's' : ''} en attente</small></div></article></section>
        <div class="dashboard-grid"><section class="panel"><div class="panel-head"><div><div class="panel-title">Les gestes clés de l’accueil</div><div class="panel-subtitle">Un parcours simple à exercer dans chaque situation</div></div></div><div class="journey"><div class="step"><span class="step-num">01 · ENTRER EN CONTACT</span><strong>Saluer</strong><span>Accueillir avec disponibilité.</span></div><div class="step"><span class="step-num">02 · COMPRENDRE</span><strong>Écouter</strong><span>Clarifier le besoin sans juger.</span></div><div class="step"><span class="step-num">03 · AGIR</span><strong>Orienter</strong><span>Vérifier avant d’indiquer.</span></div><div class="step"><span class="step-num">04 · TERMINER</span><strong>S’assurer</strong><span>Vérifier que la personne sait quoi faire.</span></div></div></section>
        <section class="panel"><div class="panel-head"><div><div class="panel-title">Scénarios à pratiquer</div><div class="panel-subtitle">Choisir une situation pour commencer</div></div></div><div class="scenario-list">${scenarios.map((scenario, index) => `<button class="scenario-link" data-scenario="${index}"><span class="scenario-icon">${['01', '02', '03'][index]}</span><span><strong>${scenario.title}</strong><small>${scenario.skill}</small></span><span class="arrow">›</span></button>`).join('')}</div></section>
        <div class="side-column">${table(recent)}</div></div>`;
    }
    function practiceView() {
      const scenario = scenarios[activeScenario];
      return `<div class="heading"><div><div class="eyebrow">Atelier de pratique · ${attempts} exercice${attempts > 1 ? 's' : ''} répondu${attempts > 1 ? 's' : ''}</div><h1>Entraînement</h1><p>Choisissez une réponse et observez les bonnes pratiques mobilisées.</p></div><div class="actions"><button class="btn" data-go="home">← Tableau de bord</button></div></div><div class="practice-layout"><section class="panel"><div class="panel-head"><div><div class="panel-title">Situations</div><div class="panel-subtitle">Choisissez un cas pratique</div></div></div><div class="scenario-menu">${scenarios.map((item, index) => `<button class="scenario-choice ${index === activeScenario ? 'active' : ''}" data-scenario="${index}"><strong>${item.title}</strong><span>${item.skill}</span></button>`).join('')}</div></section><section class="panel exercise"><div class="exercise-top"><span class="tag">${scenario.skill}</span><span class="score">Réussites : ${correct} / ${attempts}</span></div><h2 class="scenario-title">${scenario.title}</h2><p class="scenario-context">Prenez un instant pour comprendre la situation avant de répondre.</p><blockquote class="dialogue">${scenario.quote}</blockquote><div class="answer-list">${scenario.answers.map((answer, index) => { const result = chosenAnswer === null ? '' : answer.good ? 'correct' : chosenAnswer === index ? 'incorrect' : ''; const mark = chosenAnswer === null ? String.fromCharCode(65 + index) : answer.good ? '✓' : chosenAnswer === index ? '×' : String.fromCharCode(65 + index); return `<button class="answer ${result}" data-answer="${index}" ${chosenAnswer !== null ? 'disabled' : ''}><span class="answer-mark">${mark}</span><span>${answer.text}</span></button>`; }).join('')}</div><div class="feedback ${chosenAnswer !== null ? `show ${scenario.answers[chosenAnswer].good ? '' : 'miss'}` : ''}">${chosenAnswer !== null ? scenario.answers[chosenAnswer].feedback : ''}</div><div class="exercise-footer"><span>Objectif : courtoisie, clarté et respect de la confidentialité.</span>${chosenAnswer !== null ? '<button class="quiet-link" data-next>Situation suivante →</button>' : '<span>Choisissez une réponse</span>'}</div></section></div>`;
    }
    function guideView() {
      const list = places.filter(place => `${place.name} ${place.category} ${place.detail}`.toLowerCase().includes(guideQuery));
      return `<div class="heading"><div><div class="eyebrow">Aide à l’orientation · données à vérifier</div><h1>Repères campus</h1><p>Entraînez-vous à orienter sans inventer un lieu, un horaire ou une procédure.</p></div></div><div class="guide-disclaimer"><strong>Parcours de démonstration.</strong> Ces services et indications ne constituent pas l’annuaire officiel de l’UPN. Confirmez les bâtiments, horaires, noms de services et itinéraires avec l’établissement avant toute utilisation réelle.</div><div class="guide-tools"><label class="sr-only" for="guideSearch">Rechercher un service</label><input class="guide-search" id="guideSearch" type="search" placeholder="Rechercher un repère ou un service…" value="${guideQuery.replaceAll('&', '&amp;').replaceAll('"', '&quot;')}"></div><div class="guide-list">${list.map(place => `<article class="guide-item"><div class="guide-top"><strong>${place.name}</strong><span class="guide-category">${place.category}</span></div><p>${place.detail}</p><p class="direction">${place.route}</p></article>`).join('') || '<div class="empty">Aucun repère trouvé.</div>'}</div>`;
    }
    function visitorsView() {
      return `<div class="heading"><div><div class="eyebrow">Jeu de rôle · données fictives</div><h1>Visiteurs simulés</h1><p>Exercez-vous à tenir une file d’accueil sans enregistrer de vraies informations.</p></div><div class="actions"><button class="btn btn-primary" data-new-visitor>+ Simuler une arrivée</button></div></div>${table(visitors, 'Registre pédagogique')}`;
    }
    function render() {
      page.innerHTML = ({ home: homeView, practice: practiceView, guide: guideView, visitors: visitorsView })[activePage]();
      document.querySelectorAll('.nav [data-page]').forEach(button => button.classList.toggle('active', button.dataset.page === activePage));
    }
    function setPage(next) { activePage = next; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
    const backdrop = document.getElementById('backdrop');
    function openModal() { backdrop.classList.add('open'); setTimeout(() => document.getElementById('personName').focus(), 0); }
    function closeModal() { backdrop.classList.remove('open'); }
    document.addEventListener('click', event => {
      const nav = event.target.closest('[data-page]'); if (nav) setPage(nav.dataset.page);
      const go = event.target.closest('[data-go]'); if (go) setPage(go.dataset.go);
      const scenarioButton = event.target.closest('[data-scenario]');
      if (scenarioButton) { activeScenario = Number(scenarioButton.dataset.scenario); chosenAnswer = null; setPage('practice'); }
      const answer = event.target.closest('[data-answer]');
      if (answer && chosenAnswer === null) { chosenAnswer = Number(answer.dataset.answer); attempts++; if (scenarios[activeScenario].answers[chosenAnswer].good) correct++; render(); }
      if (event.target.closest('[data-next]')) { activeScenario = (activeScenario + 1) % scenarios.length; chosenAnswer = null; render(); }
      if (event.target.closest('[data-new-visitor]')) openModal();
      const action = event.target.closest('[data-action]');
      if (action) { const person = visitors.find(visitor => String(visitor.id) === action.dataset.id); if (person) { person.status = action.dataset.action === 'arrive' ? 'arrived' : 'left'; save(); render(); notify(person.status === 'arrived' ? 'Arrivée enregistrée dans la simulation.' : 'Visite clôturée dans la simulation.'); } }
      if (event.target === backdrop) closeModal();
    });
    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('cancelModal').addEventListener('click', closeModal);
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeModal(); });
    document.getElementById('visitorForm').addEventListener('submit', event => {
      event.preventDefault(); const form = new FormData(event.currentTarget); const name = String(form.get('name')).trim();
      visitors.unshift({ id: Date.now(), name, language: String(form.get('language')), destination: String(form.get('destination')), purpose: String(form.get('purpose')).trim() || 'Demande générale', time: new Date().toTimeString().slice(0, 5), status: 'expected' });
      save(); event.currentTarget.reset(); closeModal(); setPage('visitors'); notify('Visiteur fictif ajouté à la simulation.');
    });
    page.addEventListener('input', event => { if (event.target.id === 'guideSearch') { const position = event.target.selectionStart; guideQuery = event.target.value.toLowerCase().trim(); render(); const field = document.getElementById('guideSearch'); field.focus(); field.setSelectionRange(position, position); } });
    render();
  </script>
</body>
</html>
